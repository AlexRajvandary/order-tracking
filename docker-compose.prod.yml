services:
  postgres:
    image: postgres:16-alpine
    container_name: order-tracking-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: order-tracking-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/alexrajvandary/order-tracking:latest
    container_name: order-tracking-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__ProductsConnection: Host=products-postgres;Port=5432;Database=${PRODUCTS_DB};Username=${PRODUCTS_USER};Password=${PRODUCTS_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ordertracking
      Jwt__Audience: ordertracking-admin
      Seed__AdminLogin: ${SEED_ADMIN_LOGIN}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
      App__BaseUrl: ${ADMIN_BASE_URL:-https://admin.the-get.ru}
      App__PublicBaseUrl: ${PUBLIC_BASE_URL:-https://the-get.ru}
      App__AdminBaseUrl: ${ADMIN_BASE_URL:-https://admin.the-get.ru}
      App__ApiBaseUrl: ${API_BASE_URL:-https://api.the-get.ru}
      App__TrackingBaseUrl: ${TRACKING_BASE_URL:-https://tracking.the-get.ru}
      Cors__Origins__0: ${PUBLIC_BASE_URL:-https://the-get.ru}
      Cors__Origins__1: ${WWW_BASE_URL:-https://www.the-get.ru}
      Cors__Origins__2: ${ADMIN_BASE_URL:-https://admin.the-get.ru}
      Cors__Origins__3: ${TRACKING_BASE_URL:-https://tracking.the-get.ru}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME:-}
      Telegram__WebhookSecret: ${TELEGRAM_WEBHOOK_SECRET:-}
      Telegram__UsePolling: "false"
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__Bucket: order-tracking
      Minio__UseSsl: "false"
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-4o-mini}
      Fornex__ApiKey: ${FORNEX_API_KEY:-}
      Fornex__OrderId: ${FORNEX_ORDER_ID:-}
      Crawler__ApiKey: ${CRAWLER_API_KEY}
      ProductsApi__BaseUrl: http://products-api:8080
      ProductsApi__InternalApiKey: ${PRODUCTS_INTERNAL_API_KEY}
      PublicCheckout__CreatedByAdminLogin: ${PUBLIC_CHECKOUT_ADMIN_LOGIN:-admin}
      Monitoring__HostDiskPath: /host
    volumes:
      - /:/host:ro
    expose:
      - "8080"

  crawler-worker:
    image: ghcr.io/alexrajvandary/order-tracking-crawler:latest
    container_name: products-crawler-worker
    restart: unless-stopped
    depends_on:
      products-api:
        condition: service_started
      api:
        condition: service_started
    environment:
      PRODUCTS_API_URL: http://products-api:8080/api/products
      ORDER_TRACKING_API_URL: http://api:8080/api/v1
      CRAWLER_API_KEY: ${CRAWLER_API_KEY}
      CRAWLER_POLL_INTERVAL_MS: ${CRAWLER_POLL_INTERVAL_MS:-5000}
      CRAWLER_BATCH_SIZE: ${CRAWLER_BATCH_SIZE:-50}
      CRAWLER_PAGE_DELAY_MS: ${CRAWLER_PAGE_DELAY_MS:-1000}
      CRAWLER_PAGE_TIMEOUT_MS: ${CRAWLER_PAGE_TIMEOUT_MS:-60000}

  translation-worker:
    image: ghcr.io/alexrajvandary/order-tracking-translation-worker:latest
    container_name: products-translation-worker
    restart: unless-stopped
    depends_on:
      products-api:
        condition: service_started
    environment:
      TranslationJobs__ApiUrl: http://products-api:8080/api/translation-jobs
      TranslationJobs__WorkerApiKey: ${CRAWLER_API_KEY}
      TranslationJobs__PollIntervalSeconds: ${TRANSLATION_POLL_INTERVAL_SECONDS:-5}
      TranslationJobs__MaxRetries: ${TRANSLATION_MAX_RETRIES:-3}
      TranslationJobs__RetryBaseDelaySeconds: ${TRANSLATION_RETRY_BASE_DELAY_SECONDS:-2}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__Model: ${TRANSLATION_OPENAI_MODEL:-gpt-5-mini}
      OpenAI__BaseUrl: ${OPENAI_BASE_URL:-https://api.openai.com/}
      OpenAI__TimeoutSeconds: ${OPENAI_TIMEOUT_SECONDS:-120}

  catalog:
    image: ghcr.io/alexrajvandary/order-tracking-catalog:latest
    container_name: order-tracking-catalog
    restart: unless-stopped
    depends_on:
      - products-api
      - api
    environment:
      PRODUCTS_API_BASE_URL: http://products-api:8080
      ORDER_TRACKING_API_BASE_URL: http://api:8080
    expose:
      - "3000"

  products-postgres:
    image: postgres:16-alpine
    container_name: products-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${PRODUCTS_DB}
      POSTGRES_USER: ${PRODUCTS_USER}
      POSTGRES_PASSWORD: ${PRODUCTS_PASSWORD}
    volumes:
      - products_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCTS_USER} -d ${PRODUCTS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  products-api:
    image: ghcr.io/alexrajvandary/order-tracking-products:latest
    container_name: products-api
    restart: unless-stopped
    depends_on:
      products-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=products-postgres;Port=5432;Database=${PRODUCTS_DB};Username=${PRODUCTS_USER};Password=${PRODUCTS_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ordertracking
      Jwt__Audience: ordertracking-admin
      Crawler__ApiKey: ${CRAWLER_API_KEY}
      TranslationJobs__WorkerApiKey: ${CRAWLER_API_KEY}
      ProductsApi__InternalApiKey: ${PRODUCTS_INTERNAL_API_KEY}
      Sitemap__PublicBaseUrl: ${PUBLIC_BASE_URL:-https://the-get.ru}
      Sitemap__StoragePath: /app/data/sitemaps
      Sitemap__ProductsPerFile: ${SITEMAP_PRODUCTS_PER_FILE:-20000}
      Sitemap__DatabaseBatchSize: ${SITEMAP_DATABASE_BATCH_SIZE:-2000}
      Sitemap__MaxUncompressedBytes: ${SITEMAP_MAX_UNCOMPRESSED_BYTES:-41943040}
      Sitemap__RegenerationIntervalMinutes: ${SITEMAP_REGENERATION_INTERVAL_MINUTES:-60}
      Rakuten__ApplicationId: ${RAKUTEN_APPLICATION_ID}
      Rakuten__AccessKey: ${RAKUTEN_ACCESS_KEY}
      Rakuten__AffiliateId: ${RAKUTEN_AFFILIATE_ID:-}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__Bucket: order-tracking
      Minio__UseSsl: "false"
      Cors__Origins__0: ${PUBLIC_BASE_URL:-https://the-get.ru}
      Cors__Origins__1: ${WWW_BASE_URL:-https://www.the-get.ru}
      Cors__Origins__2: ${ADMIN_BASE_URL:-https://admin.the-get.ru}
    expose:
      - "8080"
    volumes:
      - products_sitemap_data:/app/data/sitemaps

  caddy:
    image: caddy:2-alpine
    container_name: order-tracking-caddy
    restart: unless-stopped
    depends_on:
      - api
      - catalog
      - products-api
    environment:
      LEGACY_SITE_ADDRESS: ${LEGACY_SITE_ADDRESS:-89-127-208-99.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: order-tracking-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
      - --web.enable-lifecycle
    volumes:
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: order-tracking-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    mem_limit: 64m
    cpus: 0.15
    security_opt:
      - no-new-privileges:true

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: order-tracking-cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    mem_limit: 128m
    cpus: 0.25

  loki:
    image: grafana/loki:3.7.0
    container_name: order-tracking-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./docker/monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    expose:
      - "3100"
    mem_limit: 256m
    cpus: 0.50

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: order-tracking-alloy
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      DEPLOY_ENVIRONMENT: Production
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    expose:
      - "12345"
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:13.2.2
    container_name: order-tracking-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${ADMIN_BASE_URL:-https://admin.the-get.ru}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/grafana/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  minio_data:
  products_postgres_data:
  products_sitemap_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
  caddy_data:
  caddy_config:
