services:
  postgres:
    image: postgres:16-alpine
    container_name: order-tracking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ordertracking}
      POSTGRES_USER: ${POSTGRES_USER:-ordertracking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordertracking}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ordertracking} -d ${POSTGRES_DB:-ordertracking}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: order-tracking-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: order-tracking-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ordertracking};Username=${POSTGRES_USER:-ordertracking};Password=${POSTGRES_PASSWORD:-ordertracking}
      ConnectionStrings__ProductsConnection: Host=products-postgres;Port=5432;Database=${PRODUCTS_DB:-products};Username=${PRODUCTS_USER:-products};Password=${PRODUCTS_PASSWORD:-products}
      Jwt__Secret: ${JWT_SECRET:-CHANGE_ME_IN_PRODUCTION_MIN_32_CHARS_LONG}
      Jwt__Issuer: ${JWT_ISSUER:-ordertracking}
      Jwt__Audience: ${JWT_AUDIENCE:-ordertracking-admin}
      Jwt__AccessExpiryHours: ${JWT_ACCESS_EXPIRY_HOURS:-24}
      Jwt__RefreshExpiryDays: ${JWT_REFRESH_EXPIRY_DAYS:-7}
      Seed__AdminLogin: ${SEED_ADMIN_LOGIN:-admin}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-admin}
      App__BaseUrl: ${APP_BASE_URL:-http://localhost:8080}
      Cors__Origins__0: ${CORS_ORIGIN:-http://localhost:8080}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      Minio__Bucket: ${MINIO_BUCKET:-order-tracking}
      Minio__UseSsl: "false"
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-4o-mini}
      Fornex__ApiKey: ${FORNEX_API_KEY:-}
      Fornex__OrderId: ${FORNEX_ORDER_ID:-}
      Crawler__ApiKey: ${CRAWLER_API_KEY:-dev-crawler-key-change-me}
      ProductsApi__BaseUrl: http://products-api:8080
      ProductsApi__InternalApiKey: ${PRODUCTS_INTERNAL_API_KEY:-dev-products-internal-key-change-me}
      Sitemap__PublicBaseUrl: ${PUBLIC_BASE_URL:-http://localhost:3001}
      Sitemap__StoragePath: /app/data/sitemaps
      Sitemap__ProductsPerFile: ${SITEMAP_PRODUCTS_PER_FILE:-20000}
      Sitemap__DatabaseBatchSize: ${SITEMAP_DATABASE_BATCH_SIZE:-2000}
      Sitemap__MaxUncompressedBytes: ${SITEMAP_MAX_UNCOMPRESSED_BYTES:-41943040}
      Sitemap__RegenerationIntervalMinutes: ${SITEMAP_REGENERATION_INTERVAL_MINUTES:-60}
      PublicCheckout__CreatedByAdminLogin: ${PUBLIC_CHECKOUT_ADMIN_LOGIN:-admin}
      Monitoring__HostDiskPath: /host
    volumes:
      - /:/host:ro
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  crawler-worker:
    build:
      context: .
      dockerfile: docker/crawler/Dockerfile
    container_name: products-crawler-worker
    restart: unless-stopped
    depends_on:
      products-api:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      PRODUCTS_API_URL: http://products-api:8080/api/products
      ORDER_TRACKING_API_URL: http://api:8080/api/v1
      CRAWLER_API_KEY: ${CRAWLER_API_KEY:-dev-crawler-key-change-me}
      CRAWLER_POLL_INTERVAL_MS: ${CRAWLER_POLL_INTERVAL_MS:-5000}
      CRAWLER_BATCH_SIZE: ${CRAWLER_BATCH_SIZE:-50}
      CRAWLER_PAGE_DELAY_MS: ${CRAWLER_PAGE_DELAY_MS:-1000}
      CRAWLER_PAGE_TIMEOUT_MS: ${CRAWLER_PAGE_TIMEOUT_MS:-60000}

  translation-worker:
    build:
      context: .
      dockerfile: docker/translation/Dockerfile
    container_name: products-translation-worker
    restart: unless-stopped
    depends_on:
      products-api:
        condition: service_healthy
    environment:
      TranslationJobs__ApiUrl: http://products-api:8080/api/translation-jobs
      TranslationJobs__WorkerApiKey: ${CRAWLER_API_KEY:-dev-crawler-key-change-me}
      TranslationJobs__PollIntervalSeconds: ${TRANSLATION_POLL_INTERVAL_SECONDS:-5}
      TranslationJobs__MaxRetries: ${TRANSLATION_MAX_RETRIES:-3}
      TranslationJobs__RetryBaseDelaySeconds: ${TRANSLATION_RETRY_BASE_DELAY_SECONDS:-2}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__Model: ${TRANSLATION_OPENAI_MODEL:-gpt-5-mini}
      OpenAI__BaseUrl: ${OPENAI_BASE_URL:-https://api.openai.com/}
      OpenAI__TimeoutSeconds: ${OPENAI_TIMEOUT_SECONDS:-120}

  products-postgres:
    image: postgres:16-alpine
    container_name: products-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PRODUCTS_DB:-products}
      POSTGRES_USER: ${PRODUCTS_USER:-products}
      POSTGRES_PASSWORD: ${PRODUCTS_PASSWORD:-products}
    ports:
      - "${PRODUCTS_POSTGRES_PORT:-5434}:5432"
    volumes:
      - products_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRODUCTS_USER:-products} -d ${PRODUCTS_DB:-products}"]
      interval: 10s
      timeout: 5s
      retries: 5

  products-api:
    build:
      context: .
      dockerfile: docker/products/Dockerfile
    container_name: products-api
    restart: unless-stopped
    depends_on:
      products-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Host=products-postgres;Port=5432;Database=${PRODUCTS_DB:-products};Username=${PRODUCTS_USER:-products};Password=${PRODUCTS_PASSWORD:-products}
      Jwt__Secret: ${JWT_SECRET:-CHANGE_ME_IN_PRODUCTION_MIN_32_CHARS_LONG}
      Jwt__Issuer: ${JWT_ISSUER:-ordertracking}
      Jwt__Audience: ${JWT_AUDIENCE:-ordertracking-admin}
      Crawler__ApiKey: ${CRAWLER_API_KEY:-dev-crawler-key-change-me}
      TranslationJobs__WorkerApiKey: ${CRAWLER_API_KEY:-dev-crawler-key-change-me}
      ProductsApi__InternalApiKey: ${PRODUCTS_INTERNAL_API_KEY:-dev-products-internal-key-change-me}
      Rakuten__ApplicationId: ${RAKUTEN_APPLICATION_ID:-}
      Rakuten__AccessKey: ${RAKUTEN_ACCESS_KEY:-}
      Rakuten__AffiliateId: ${RAKUTEN_AFFILIATE_ID:-}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      Minio__Bucket: ${MINIO_BUCKET:-order-tracking}
      Minio__UseSsl: "false"
      Cors__Origins__0: ${CORS_ORIGIN:-http://localhost:5173}
      Cors__Origins__1: http://localhost:3001
    ports:
      - "${PRODUCTS_API_PORT:-5281}:8080"
    volumes:
      - products_sitemap_data:/app/data/sitemaps
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: order-tracking-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
      - --web.enable-lifecycle
    volumes:
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: order-tracking-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    mem_limit: 64m
    cpus: 0.15
    security_opt:
      - no-new-privileges:true

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: order-tracking-cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    mem_limit: 128m
    cpus: 0.25

  loki:
    image: grafana/loki:3.7.0
    container_name: order-tracking-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./docker/monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    expose:
      - "3100"
    mem_limit: 256m
    cpus: 0.50

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: order-tracking-alloy
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      DEPLOY_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    expose:
      - "12345"
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:13.2.2
    container_name: order-tracking-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/grafana/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  minio_data:
  products_postgres_data:
  products_sitemap_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
