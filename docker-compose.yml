services:
  postgres:
    image: postgres:16-alpine
    container_name: order-tracking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ordertracking}
      POSTGRES_USER: ${POSTGRES_USER:-ordertracking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordertracking}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ordertracking} -d ${POSTGRES_DB:-ordertracking}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: order-tracking-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: order-tracking-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ordertracking};Username=${POSTGRES_USER:-ordertracking};Password=${POSTGRES_PASSWORD:-ordertracking}
      Jwt__Secret: ${JWT_SECRET:-CHANGE_ME_IN_PRODUCTION_MIN_32_CHARS_LONG}
      Jwt__Issuer: ${JWT_ISSUER:-ordertracking}
      Jwt__Audience: ${JWT_AUDIENCE:-ordertracking-admin}
      Jwt__AccessExpiryHours: ${JWT_ACCESS_EXPIRY_HOURS:-24}
      Jwt__RefreshExpiryDays: ${JWT_REFRESH_EXPIRY_DAYS:-7}
      Seed__AdminLogin: ${SEED_ADMIN_LOGIN:-admin}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-admin}
      App__BaseUrl: ${APP_BASE_URL:-http://localhost:8080}
      Cors__Origins__0: ${CORS_ORIGIN:-http://localhost:8080}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
      Minio__Bucket: ${MINIO_BUCKET:-order-tracking}
      Minio__UseSsl: "false"
      Monitoring__HostDiskPath: /host
    volumes:
      - /:/host:ro
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  minio_data:
