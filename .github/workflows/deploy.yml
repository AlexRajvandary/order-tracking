name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_API: ghcr.io/alexrajvandary/order-tracking
  IMAGE_CATALOG: ghcr.io/alexrajvandary/order-tracking-catalog
  IMAGE_PRODUCTS: ghcr.io/alexrajvandary/order-tracking-products
  IMAGE_CRAWLER: ghcr.io/alexrajvandary/order-tracking-crawler
  IMAGE_TRANSLATION: ghcr.io/alexrajvandary/order-tracking-translation-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push catalog image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/catalog/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_CATALOG }}:latest
            ${{ env.IMAGE_CATALOG }}:${{ github.sha }}
          cache-from: type=gha,scope=catalog
          cache-to: type=gha,mode=max,scope=catalog

      - name: Build and push products image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/products/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PRODUCTS }}:latest
            ${{ env.IMAGE_PRODUCTS }}:${{ github.sha }}
          cache-from: type=gha,scope=products
          cache-to: type=gha,mode=max,scope=products

      - name: Build and push crawler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/crawler/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_CRAWLER }}:latest
            ${{ env.IMAGE_CRAWLER }}:${{ github.sha }}
          cache-from: type=gha,scope=crawler
          cache-to: type=gha,mode=max,scope=crawler

      - name: Build and push translation worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/translation/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_TRANSLATION }}:latest
            ${{ env.IMAGE_TRANSLATION }}:${{ github.sha }}
          cache-from: type=gha,scope=translation-worker
          cache-to: type=gha,mode=max,scope=translation-worker

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync compose and Caddyfile to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.prod.yml,docker/caddy/Caddyfile"
          target: "~/order-tracking"
          strip_components: 0

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ~/order-tracking
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "=== Caddyfile on VPS ==="
            cat docker/caddy/Caddyfile
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate api catalog products-postgres products-api crawler-worker translation-worker caddy
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
